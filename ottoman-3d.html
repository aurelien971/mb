<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ottoman 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbfaf9; overflow: hidden;
    font: 400 12px/1.4 "SF Pro Display", -apple-system, BlinkMacSystemFont, Arial, sans-serif; color: #232323; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .label { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; text-transform: uppercase; letter-spacing: .06em; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Ottoman · drag to turn</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const FRONT = "product-images/ottoman/01.webp";
const BACK = null;          // drop a rear photo path here when there is one
const GRID = 260;           // mesh resolution across the width
const DEPTH = 0.16;         // how much the garment puffs out, relative to its width

// ---- 1. cut the shirt out of the white background ----
async function loadImage(src) {
  const img = new Image(); img.src = src; await img.decode(); return img;
}
function maskFrom(img, w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  const m = new Float32Array(w * h);
  // the product photos have a transparent background; fall back to "not white" for photos that don't
  for (let i = 0; i < w * h; i++) m[i] = d[i * 4 + 3] > 128 && Math.min(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]) < 225 ? 1 : 0;
  return m;
}

// ---- 2. distance from the edge → height, so the cut-out puffs up like fabric ----
function distanceField(m, w, h) {
  const INF = 1e9, d = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) d[i] = m[i] ? INF : 0;
  const at = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : d[y * w + x]);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {          // forward pass
    const i = y * w + x; if (!d[i]) continue;
    d[i] = Math.min(d[i], at(x - 1, y) + 1, at(x, y - 1) + 1, at(x - 1, y - 1) + 1.414, at(x + 1, y - 1) + 1.414);
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) { // backward pass
    const i = y * w + x; if (!d[i]) continue;
    d[i] = Math.min(d[i], at(x + 1, y) + 1, at(x, y + 1) + 1, at(x + 1, y + 1) + 1.414, at(x - 1, y + 1) + 1.414);
  }
  return d;
}
function blur(a, w, h, r) {
  const out = new Float32Array(a.length), tmp = new Float32Array(a.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, n = 0; for (let k = -r; k <= r; k++) { const xx = x + k; if (xx >= 0 && xx < w) { s += a[y * w + xx]; n++; } }
    tmp[y * w + x] = s / n;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, n = 0; for (let k = -r; k <= r; k++) { const yy = y + k; if (yy >= 0 && yy < h) { s += tmp[yy * w + x]; n++; } }
    out[y * w + x] = s / n;
  }
  return out;
}

// ---- 3. build the scene ----
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xfbfaf9);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(2, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(-3, 1, -3); scene.add(rim);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);

const front = await loadImage(FRONT);
const aspect = front.naturalHeight / front.naturalWidth;
const gw = GRID, gh = Math.round(GRID * aspect);
const mask = maskFrom(front, gw, gh);
const dist = distanceField(mask, gw, gh);
let dmax = 0; for (const v of dist) dmax = Math.max(dmax, v);
// rounded profile: steep at the edges, flat-ish across the chest, then smoothed
const heightRaw = new Float32Array(gw * gh);
// starts at exactly 0 on the outline so the front and back halves close into one shell
for (let i = 0; i < gw * gh; i++) { const t = Math.min(1, Math.max(0, dist[i] - 1) / (dmax * 0.6)); heightRaw[i] = Math.sqrt(t * (2 - t)); }
// smooth, then pin the outermost ring back to 0 so the two halves meet exactly
const height = blur(heightRaw, gw, gh, 1).map((v, i) => (mask[i] && dist[i] > 1.5 ? v : 0));

function shell(sign) {
  const W = 1, H = aspect;
  const geo = new THREE.PlaneGeometry(W, H, gw - 1, gh - 1);
  const pos = geo.attributes.position;
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const v = j * gw + i;
    pos.setZ(v, sign * height[v] * DEPTH);
  }
  // keep only triangles fully inside the shirt: the outline vertices sit at z = 0 on
  // both halves, so front and back share one closed edge with no see-through gap
  const idx = geo.index.array, keep = [];
  for (let t = 0; t < idx.length; t += 3)
    if (mask[idx[t]] && mask[idx[t + 1]] && mask[idx[t + 2]]) keep.push(idx[t], idx[t + 1], idx[t + 2]);
  geo.setIndex(keep);
  geo.computeVertexNormals();
  return geo;
}

const tex = new THREE.Texture(front); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.needsUpdate = true;
const fabric = { roughness: 0.92, metalness: 0, side: THREE.DoubleSide };
const frontMesh = new THREE.Mesh(shell(1), new THREE.MeshStandardMaterial({ map: tex, ...fabric }));

// back: a rear photo if we have one, otherwise the front photo seen from behind, a touch darker
let backTex = tex;
if (BACK) { backTex = new THREE.Texture(await loadImage(BACK)); backTex.colorSpace = THREE.SRGBColorSpace; backTex.needsUpdate = true; backTex.wrapS = THREE.RepeatWrapping; backTex.repeat.x = -1; }
const backMesh = new THREE.Mesh(shell(1), new THREE.MeshStandardMaterial({ map: backTex, color: BACK ? 0xffffff : 0xdddddd, ...fabric }));
backMesh.scale.z = -1;              // mirror the shell to the other side so the two halves meet at the outline
                                    // (the negative scale also flips its faces to point backwards)

const shirt = new THREE.Group();
shirt.add(frontMesh, backMesh);
scene.add(shirt);

// soft floor shadow
const sc = document.createElement("canvas"); sc.width = sc.height = 128;
{ const g = sc.getContext("2d"), r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, "rgba(0,0,0,.22)"); r.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = r; g.fillRect(0, 0, 128, 128); }
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.35), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = -aspect / 2 - 0.04;
scene.add(shadow);

// ---- 4. turntable: slow spin, drag to turn, eases back into the spin ----
let angle = 0, vel = 0.45, dragging = false, lastX = 0, tilt = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => { if (!dragging) return; const dx = e.clientX - lastX; lastX = e.clientX; angle += dx * 0.01; vel = dx * 0.6; });
const up = () => { dragging = false; };
canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const fit = (aspect * 0.5 + 0.12) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(0, 0.05, Math.max(fit, fit * 0.85 / camera.aspect));
  camera.lookAt(0, -0.02, 0);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!dragging && !window.__freeze) { vel += (0.45 - vel) * dt * 1.5; angle += vel * dt; }
  shirt.rotation.y = angle;
  shirt.position.y = Math.sin(clock.elapsedTime * 1.2) * 0.008;   // a gentle hang/float
  renderer.render(scene, camera);
});
window.__setAngle = a => { angle = a; vel = 0; };   // for screenshots
</script>
</body>
</html>
