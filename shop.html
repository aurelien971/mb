<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Shop Working Copy</title>
<style>
  :root {
    --gutter: clamp(24px, 5vw, 80px);
    --maxw: 1440px;
    --edge: max(var(--gutter), calc((100vw - var(--maxw)) / 2 + var(--gutter))); --paper: #fbfaf9; --ink: #232323; --black: #000; --grey: #808080; --line: #dcdcdc; --red: #e95144; --dot: #fc605b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 400 14px/22px "SF Pro Display", -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* header, three layouts measured on the live site:
     phone (<768): menu left, logo centred 150×15, bag right
     tablet (768–1024): logo left 150×15, menu + bag right
     desktop (>=1025): logo left 170×18, text links + bag right */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; height: 50px; pointer-events: none; }
  header > * { pointer-events: auto; }
  header svg { display: block; }
  .brand { position: absolute; left: var(--edge); top: 14px; height: 15px; display: block; }
  .brand img { display: block; width: 150px; height: 15px; }
  .links { display: none; }
  .menu { position: absolute; right: calc(var(--edge) + 34px); top: 9px; }
  .cart { position: absolute; right: var(--edge); top: 11px; }
  @media (max-width: 767px) {
    .brand { left: 50%; margin-left: -75px; top: 19px; }
    .menu { left: var(--edge); right: auto; top: 13px; }
    .cart { right: var(--edge); top: 15px; }
  }
  @media (min-width: 1025px) {
    .brand { top: 18px; height: 18px; }
    .brand img { width: 170px; height: 18px; }
    .menu { display: none; }
    .links { display: flex; gap: 14px; position: absolute; right: calc(var(--edge) + 43px); top: 15px;
      font-size: 14px; line-height: 22px; text-transform: uppercase; color: #000; }
    .cart { right: var(--edge); top: 14px; }
  }
  .cart .dot { position: absolute; left: 50%; top: 38px; width: 14px; height: 14px; margin-left: -18px;
    border-radius: 50%; background: var(--dot); }

  /* 360 panorama: 700px dark viewer at the top of a 740px section */
  .pano { padding-bottom: 40px; }
  .pano-wrap { position: relative; height: 700px; background: #111; overflow: hidden; touch-action: none; }
  .pano-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .pano-wrap canvas:active { cursor: grabbing; }
  .pano-btn { position: absolute; right: 14px; width: 36px; height: 36px; border: 0; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.18); color: #fff; font-size: 20px; line-height: 36px; cursor: pointer; }
  .pano-in { bottom: 56px; }
  .pano-out { bottom: 14px; font-size: 22px; }
  .pano-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap;
    padding: 6px 18px; border-radius: 20px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; line-height: 22px;
    opacity: 0; transition: opacity .6s; pointer-events: none; }
  .pano-hint.on { opacity: 1; }

  /* home */
  /* hero: the visible frame is 100vh on the video's own background (rgb 240,243,240);
     the extra 120vh is scroll distance for the two flips, during which the frame stays put */
  .hero { height: 220vh; background: #f0f3f0; position: relative; }
  .hero .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .hero canvas { display: block; width: 100%; height: 100%; }
  .hero .down { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); }
  .label { text-transform: uppercase; font-size: 14px; font-weight: 400; line-height: 24px; padding: 51px var(--edge) 48px; display: flex; align-items: center; gap: 7px; }
  .label .lock { width: 9px; height: 11px; flex: none; position: relative; top: -1px; }
  /* measured at 850px: cards x30/302/573, 247 wide, rows 416 apart */
  /* smaller cards with room around them, so the 3.5% hover growth never touches a neighbour */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 72px 44px; padding: 0 var(--edge) 80px; }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 700px) { .grid { gap: 40px 16px; padding: 0 var(--edge) 60px; grid-template-columns: repeat(2, 1fr); } .label { padding: 40px var(--edge) 28px; } }
  .card { display: block; transition: transform .3s ease; }
  .card:hover { transform: scale(1.035); }
  .card .img { aspect-ratio: 247/329; position: relative; display: grid; place-items: center; }
  /* mini slider: photos sit side by side and slide 0.35s; dots + arrows fade in on hover (0.25s) */
  .slides { position: absolute; inset: 0; overflow: hidden; }
  .slide { position: absolute; inset: 0; transition: transform .35s, visibility 0s linear .35s; visibility: hidden; }
  .slide.on { visibility: visible; transition: transform .35s, visibility 0s; }
  .slide img { width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 0 0 rgba(0,0,0,0)); transition: filter .3s ease; }
  /* hover: a soft shadow that follows the garment's outline (photos have transparent backgrounds) */
  .card:hover .slide img { filter: drop-shadow(0 14px 18px rgba(0,0,0,.22)); }
  .dots { position: absolute; left: 0; top: 0; display: flex; gap: 6.5px; opacity: 0; visibility: hidden; transition: opacity .25s; z-index: 2; }
  .dots button { width: 6px; height: 6px; padding: 0; border-radius: 50%; cursor: pointer;
    background: rgba(255,255,255,.7); border: 1px solid rgba(0,0,0,.15); transition: background .2s; }
  .dots button.on { background: #000; border-color: #000; opacity: .4; }
  .arrow { position: absolute; top: 50%; width: 29px; height: 29px; margin-top: -14.5px; padding: 0; border: 0; border-radius: 50%;
    background: none; color: #cbcbcb; cursor: pointer; display: grid; place-items: center;
    opacity: 0; visibility: hidden; transition: opacity .25s, background .2s; z-index: 2; }
  .arrow.prev { left: -10px; }
  .arrow.next { right: -19px; }
  .card:hover .dots, .card:hover .arrow { opacity: 1; visibility: visible; }
  /* touch screens: dots always on, no hover arrows (they would hang off the screen edge) */
  @media (hover: none) { .dots { opacity: 1; visibility: visible; } .arrow { display: none; } }
  .card .meta { display: flex; justify-content: space-between; gap: 12px; padding: 16px 4px 0; line-height: 20px; text-transform: uppercase; font-size: 12px; color: var(--black); }
  .missing { color: var(--grey); font-size: 12px; text-transform: uppercase; }

  /* product page — measured at 850px wide:
     info column x20 w405, title y169, price y202, sizes y264, add y313 (405×50),
     gallery x493 w300, images 300×375 starting y93 with 9px gaps */
  .pdp { display: grid; grid-template-columns: 405fr 68fr 300fr; padding: 93px var(--edge) 80px; }
  .info { grid-column: 1; position: sticky; top: 163px; align-self: start; margin-top: 70px; }
  .gallery { grid-column: 3; display: grid; gap: 9px; }
  .gallery img { width: 100%; aspect-ratio: 300/375; object-fit: contain; display: block; cursor: zoom-in; }
  /* 3D tile (only when models/<handle>.glb exists) */
  .model3d { position: relative; width: 100%; aspect-ratio: 300/375; }
  /* with a 3D model the viewer is the main view: wider gallery column, tall panel on top */
  .pdp.has3d { grid-template-columns: 405fr 40fr 365fr; }
  .pdp.has3d .model3d { aspect-ratio: auto; height: calc(100vh - 130px); min-height: 460px; }
  .model3d .tag { position: absolute; left: 0; top: 0; z-index: 1; font-size: 11px; line-height: 16px; text-transform: uppercase; color: #8a8a8a; pointer-events: none; }
  /* fabric magnifier: shows the photo at its full resolution (1 photo pixel per screen pixel or better) */
  .loupe { position: fixed; z-index: 30; width: 220px; height: 220px; border-radius: 50%; pointer-events: none;
    border: 1px solid rgba(0,0,0,.15); box-shadow: 0 6px 24px rgba(0,0,0,.18); background: #fbfaf9 no-repeat;
    transform: translate(-50%, -50%); display: none; }
  .zoom { position: fixed; inset: 0; z-index: 40; background: #fbfaf9; overflow: auto; cursor: zoom-out; }
  .zoom img { display: block; max-width: none; }
  .zoom .close { position: fixed; top: 14px; right: 20px; font-size: 12px; text-transform: uppercase; pointer-events: none; }
  .title { font-size: 15px; font-weight: 600; line-height: 30px; text-transform: uppercase; color: var(--black); margin: 0; }
  .price { font-size: 15px; line-height: 18px; margin-top: 9px; }
  .size-label { font-size: 14px; font-weight: 500; text-transform: uppercase; margin-top: 18px; padding-left: 2px; }
  .sizes { display: flex; gap: 10px; margin-top: 4px; }
  .sizes button { width: 20px; height: 30px; padding: 0; border: 0; background: none; cursor: pointer; position: relative;
    font-size: 14px; font-weight: 500; color: var(--black); }
  .sizes button.soldout { color: var(--grey); cursor: default; }
  .sizes button.soldout::after { content: ""; position: absolute; left: -1px; right: -1px; top: 50%; height: 1px;
    background: var(--red); transform: rotate(-45deg); }
  .sizes button[aria-pressed=true] { color: var(--black); }
  .add { display: block; width: 100%; height: 50px; margin-top: 19px; border: 2px solid var(--black); background: var(--black);
    color: #fff; font-size: 14px; line-height: 20px; text-transform: uppercase; padding: 13px 15px; cursor: pointer; }
  .desc { margin: 15px 0 0; font-size: 12px; font-weight: 500; line-height: 22px; text-transform: uppercase; }
  .desc p { margin: 0; }
  .acc { margin-top: 28px; }
  .acc details { border-top: 1px solid var(--line); }
  .acc summary { list-style: none; display: flex; justify-content: space-between; align-items: center; height: 43px; cursor: pointer;
    font-size: 12px; font-weight: 500; text-transform: uppercase; }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary svg { transition: transform .2s; }
  .acc details[open] summary svg { transform: rotate(180deg); }
  .acc .body { font-size: 12px; line-height: 20px; padding: 0 0 14px; color: var(--ink); }
  .rail { position: fixed; right: 42px; top: 357px; width: 1px; height: 96px; background: #d4d4d4; }
  .rail i { position: absolute; left: -.5px; width: 2px; background: var(--black); top: 0; }

  @media (max-width: 700px) {
    /* phones: the main view (3D, or the first photo) comes first, product info below */
    .pdp { display: flex; flex-direction: column; padding-top: 50px; }
    .gallery { order: -1; }
    .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0; }
    .gallery img, .gallery .model3d { flex: 0 0 100%; scroll-snap-align: start; }
    .pdp.has3d .model3d { height: 70vh; min-height: 0; }
    .pdp { padding-left: 0; padding-right: 0; }
    .info { position: static; margin: 20px var(--edge); align-self: stretch; }
    .rail { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/" aria-label="Maxime Black"><img src="assets/logo.svg" alt="Maxime Black" width="150" height="15"></a>
  <nav class="links"><a href="#/">All</a><a href="#/">Ready to Wear</a><a href="#/">Accessories</a></nav>
  <a href="#/" class="menu" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.2"><path d="M3 7h18M3 17h18"/></svg></a>
  <a href="#/" class="cart" aria-label="Cart"><svg width="18" height="20" viewBox="0 0 19 20" fill="none" stroke="#000" stroke-width="1.6"><path d="M1 5.5h17V19H1z"/><path d="M6 5.5V3.5a3.5 3.5 0 0 1 7 0v2"/></svg><span class="dot" hidden></span></a>
</header>
<main id="app"></main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import { mountStudsHero } from "./assets/studs-hero.js";
import { mountPanorama } from "./assets/panorama.js";
import { mountGarmentViewer } from "./assets/garment-viewer.js";
// Working-copy catalogue. Ottoman's details come from the live product page;
// the rest are placeholders until the products CSV export replaces them.
const PRODUCTS = [
  { handle: "ottoman", title: "Ottoman", images: ["01.webp", "02.webp", "03.webp"],
    material: "100% waffle cotton",
    sizes: [["1", true], ["2", false], ["3", false]],
    desc: ["Made in London.", "Foam trucker shape.", "Pony hair skull patch.", "Material : 100% acrilic", "Size guide", "One size"] },
  { handle: "2z-pants",                title: "2Z Pants",                images: ["01.png"] },
  { handle: "teddy-jacket",            title: "Teddy Jacket",            images: ["01.webp", "02.webp"] },
  { handle: "spectre-overshirt",       title: "Spectre Overshirt",       images: ["01.webp", "02.webp"] },
  { handle: "phantom-pants",           title: "Phantom Pants",           images: ["01.webp", "02.png"] },
  { handle: "hooded-cardigan-in-wool", title: "Hooded Cardigan in Wool", images: ["01.webp", "02.webp", "03.webp"] },
  { handle: "clone-pants",             title: "Clone Pants",             images: [] },
  { handle: "z2-top",                  title: "2Z Top",                  images: [] },
].map(p => ({ price: 0, sizes: [["1", true], ["2", true], ["3", true]], desc: ["Description placeholder"], ...p }));

const ACCORDIONS = ["Material", "Size guide", "Shipping and return"];
const CHEVRON = `<svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="#232323" stroke-width="1.4"><path d="M1 1l8 8 8-8"/></svg>`;
const src = (p, f) => `product-images/${p.handle}/${f}`;
const gbp = n => "£" + n.toFixed(2);
const app = document.getElementById("app");
const cart = [];

const CHEV = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 3l5 5-5 5"/></svg>`;

function cardHTML(p) {
  const n = p.images.length;
  const gallery = !n ? `<span class="missing">Image needed</span>` : `
    <div class="slides">${p.images.map((f, i) =>
      `<div class="slide${i ? "" : " on"}" style="transform:translateX(${i * 100}%)"><img src="${src(p, f)}" alt="${i ? "" : p.title}" loading="lazy"></div>`).join("")}</div>
    ${n > 1 ? `
      <div class="dots">${p.images.map((_, i) => `<button class="${i ? "" : "on"}" data-go="${i}" aria-label="Image ${i + 1}"></button>`).join("")}</div>
      <button class="arrow prev" data-step="-1" aria-label="Previous image" style="transform:rotate(180deg)">${CHEV}</button>
      <button class="arrow next" data-step="1" aria-label="Next image">${CHEV}</button>` : ""}`;
  return `<a class="card" href="#/products/${p.handle}" data-i="0" data-n="${n}">
    <div class="img">${gallery}</div>
    <div class="meta"><span>${p.title}</span><span>${gbp(p.price)}</span></div>
  </a>`;
}

function showSlide(card, i) {
  const n = +card.dataset.n;
  i = (i + n) % n;
  card.dataset.i = i;
  card.querySelectorAll(".slide").forEach((s, k) => {
    s.style.transform = `translateX(${(k - i) * 100}%)`;
    s.classList.toggle("on", k === i);
  });
  card.querySelectorAll(".dots button").forEach((d, k) => d.classList.toggle("on", k === i));
}

// arrows and dots change the photo without opening the product
app.addEventListener("click", e => {
  const ctl = e.target.closest(".arrow, .dots button");
  if (!ctl) return;
  e.preventDefault();
  const card = ctl.closest(".card");
  showSlide(card, ctl.dataset.go != null ? +ctl.dataset.go : +card.dataset.i + +ctl.dataset.step);
});

function home() {
  app.innerHTML = `
    <section class="hero">
      <div class="stage"><canvas></canvas>
      <svg class="down" width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="#232323" stroke-width="1.2"><path d="M1 1l10 8 10-8M1 9l10 8 10-8"/></svg></div>
    </section>
    <div class="label"><svg class="lock" viewBox="0 0 9 11" fill="none" stroke="currentColor" stroke-width="1" aria-label="Locked"><rect x=".5" y="4.5" width="8" height="6"/><path d="M2 4.5V3a2.5 2.5 0 0 1 5 0v1.5"/></svg>Recently added</div>
    <div class="grid">${PRODUCTS.map(cardHTML).join("")}</div>
    <section class="pano">
      <div class="pano-wrap">
        <canvas></canvas>
        <div class="pano-hint">🖱 Drag to look around &nbsp;·&nbsp; Scroll to zoom</div>
        <button class="pano-btn pano-in" aria-label="Zoom in">+</button>
        <button class="pano-btn pano-out" aria-label="Zoom out">−</button>
      </div>
    </section>`;
  scrollTo(0, 0);
  const stopStuds = mountStudsHero(app.querySelector(".hero"));
  const stopPano = mountPanorama(app.querySelector(".pano-wrap"));
  destroyHero = () => { stopStuds(); stopPano(); };
}

function product(handle) {
  const p = PRODUCTS.find(x => x.handle === handle);
  if (!p) return home();
  let selected = (p.sizes.find(([, ok]) => ok) || [""])[0];
  app.innerHTML = `
    <div class="pdp">
      <div class="info">
        <h1 class="title">${p.title}</h1>
        <div class="price">${gbp(p.price)}</div>
        <div class="size-label">Size: <span id="sel">${selected}</span></div>
        <div class="sizes">${p.sizes.map(([s, ok]) =>
          `<button class="${ok ? "" : "soldout"}" ${ok ? "" : "disabled"} aria-pressed="${s === selected}">${s}</button>`).join("")}</div>
        <button class="add">Add to cart</button>
        <div class="desc">${p.desc.map(l => `<p>${l}</p>`).join("")}</div>
        <div class="acc">${ACCORDIONS.map(a =>
          `<details><summary>${a}${CHEVRON}</summary><div class="body">${a === "Material" && p.material ? p.material : "Placeholder until the real content is in."}</div></details>`).join("")}</div>
      </div>
      <div class="gallery">${p.images.map(f => `<img src="${src(p, f)}" alt="${p.title}">`).join("")
        || `<div class="card"><div class="img"><span class="missing">Image needed</span></div></div>`}</div>
    </div>
    <div class="rail"><i></i></div>`;
  app.querySelectorAll(".sizes button:not(.soldout)").forEach(b => b.onclick = () => {
    selected = b.textContent;
    document.getElementById("sel").textContent = selected;
    app.querySelectorAll(".sizes button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  app.querySelector(".add").onclick = () => { cart.push([p.handle, selected]); document.querySelector(".cart .dot").hidden = false; };
  scrollTo(0, 0);
  updateRail();
  app.querySelectorAll(".gallery img").forEach(magnify);
  mount3d(p);
}

// 3D garment from the pattern maker's export: models/<handle>.glb (see models/README.md)
async function mount3d(p) {
  const url = `models/${p.handle}.glb`;
  const ok = await fetch(url, { method: "HEAD" }).then(r => r.ok && !/text\/html/.test(r.headers.get("content-type") || ""), () => false);
  const gallery = app.querySelector(".gallery");
  if (!ok || !gallery || !location.hash.endsWith(p.handle)) return;
  const tile = Object.assign(document.createElement("div"), { className: "model3d" });
  tile.innerHTML = `<span class="tag">3D · drag to turn · scroll to zoom</span>`;
  gallery.prepend(tile);
  app.querySelector(".pdp").classList.add("has3d");
  updateRail();
  let viewer = null, gone = false;
  destroyHero = () => { gone = true; viewer?.destroy(); };
  viewer = await mountGarmentViewer(tile, { src: url });
  if (gone) viewer.destroy();
}

// --- fabric magnifier -------------------------------------------------------
// Desktop: a round loupe follows the mouse and shows the photo at full resolution.
// Click (or tap on phones) opens the photo full size, centred on that spot, to pan around.
const loupe = document.body.appendChild(Object.assign(document.createElement("div"), { className: "loupe" }));
const canHover = matchMedia("(hover: hover)").matches;
const zoomScale = () => Math.max(1, 2 / devicePixelRatio);   // never below the photo's own pixels
function spot(img, e) {
  // where the pointer is on the photo itself (object-fit: contain leaves margins)
  const r = img.getBoundingClientRect(), k = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k, ox = r.left + (r.width - w) / 2, oy = r.top + (r.height - h) / 2;
  return { fx: (e.clientX - ox) / w, fy: (e.clientY - oy) / h };
}
function magnify(img) {
  if (canHover) {
    img.addEventListener("mousemove", e => {
      if (!img.naturalWidth) return;
      const { fx, fy } = spot(img, e);
      if (fx < 0 || fy < 0 || fx > 1 || fy > 1) { loupe.style.display = "none"; return; }
      const W = img.naturalWidth * zoomScale(), H = img.naturalHeight * zoomScale();
      Object.assign(loupe.style, {
        display: "block", left: e.clientX + "px", top: e.clientY + "px",
        backgroundImage: `url("${img.src}")`, backgroundSize: `${W}px ${H}px`,
        backgroundPosition: `${110 - fx * W}px ${110 - fy * H}px`,
      });
    });
    img.addEventListener("mouseleave", () => { loupe.style.display = "none"; });
  }
  img.addEventListener("click", e => {
    const { fx, fy } = spot(img, e);
    loupe.style.display = "none";
    const z = document.body.appendChild(Object.assign(document.createElement("div"), { className: "zoom" }));
    z.innerHTML = `<img src="${img.src}" alt=""><span class="close">Close ×</span>`;
    const big = z.querySelector("img");
    const place = () => {
      const k = zoomScale();
      big.style.width = img.naturalWidth * k + "px";
      z.scrollTo(Math.max(0, fx * img.naturalWidth * k - innerWidth / 2), Math.max(0, fy * img.naturalHeight * k - innerHeight / 2));
    };
    big.complete ? place() : big.addEventListener("load", place, { once: true });
    z.addEventListener("click", () => z.remove());
  });
}

// gallery progress rail on the right edge
function updateRail() {
  const rail = document.querySelector(".rail i"), g = document.querySelector(".gallery");
  if (!rail || !g) return;
  const max = Math.max(1, g.offsetHeight - innerHeight + 93);
  const frac = Math.min(1, innerHeight / (g.offsetHeight + 93));
  rail.style.height = (96 * frac) + "px";
  rail.style.top = (96 * (1 - frac) * Math.min(1, scrollY / max)) + "px";
}
addEventListener("scroll", updateRail, { passive: true });
addEventListener("resize", updateRail);

let destroyHero = null;
function route() {
  destroyHero?.(); destroyHero = null;
  const m = location.hash.match(/^#\/products\/(.+)$/);
  m ? product(m[1]) : home();
}
addEventListener("hashchange", route);
